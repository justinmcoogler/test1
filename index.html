<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Sproutlands — Voxel Sandbox RPG</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%234a7a3a'/><rect x='4' y='12' width='8' height='2' fill='%236b4a2a'/><rect x='7' y='6' width='2' height='6' fill='%233e7d32'/><rect x='3' y='6' width='4' height='2' fill='%236fbf4a'/><rect x='9' y='5' width='4' height='2' fill='%236fbf4a'/><rect x='7' y='4' width='2' height='2' fill='%23a8e57a'/></svg>">
<meta name="theme-color" content="#5f9e46">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game-canvas"></canvas>

<!-- ===== Title screen ===== -->
<div id="title-screen" class="fullscreen-overlay">
  <div class="title-box">
    <h1 class="game-title">SPROUTLANDS</h1>
    <p class="game-subtitle">A voxel sandbox role-playing adventure</p>
    <div id="save-slots" class="save-slots"></div>
    <button id="learning-mode-btn" class="slot-btn learn-btn"></button>
    <div class="title-row">
      <input id="seed-input" type="text" placeholder="World seed (optional)" autocomplete="off">
    </div>
    <button id="characters-btn" class="link-btn">Characters…</button>
  </div>
</div>

<!-- ===== Characters ===== -->
<!-- A character is separate from the world it is in, so it can be carried into
     another one — or off this device entirely as a pasteable code. -->
<div id="character-screen" class="fullscreen-overlay hidden">
  <div class="title-box">
    <h2 class="game-title small">Characters</h2>
    <p class="char-blurb">Your skills, pack, mounts and pets travel with you. Worlds keep their own terrain, quests and clock.</p>
    <div id="character-list" class="save-slots"></div>
    <div class="title-row">
      <input id="char-name" type="text" placeholder="New character name" autocomplete="off" maxlength="24">
      <button id="char-new" class="link-btn">Create</button>
    </div>
    <div class="title-row">
      <input id="char-code" type="text" placeholder="Paste a character code to import" autocomplete="off">
      <button id="char-import" class="link-btn">Import</button>
    </div>
    <p id="char-msg" class="char-msg"></p>
    <button id="char-back" class="link-btn">Back</button>
    <p class="title-hint" id="title-hint"></p>
    <button id="install-btn" class="install-btn hidden">Install Sproutlands</button>
  </div>
</div>

<!-- ===== Loading ===== -->
<div id="loading-screen" class="fullscreen-overlay hidden">
  <div class="title-box">
    <h2 id="loading-text">Shaping the world…</h2>
    <div class="loading-bar"><div id="loading-fill"></div></div>
  </div>
</div>

<!-- ===== HUD ===== -->
<div id="hud" class="hidden">
  <div id="crosshair">+</div>

  <div id="vitals">
    <div class="vital-bar hp"><div class="vital-fill" id="hp-fill"></div><span id="hp-text"></span></div>
    <div class="vital-bar energy"><div class="vital-fill" id="energy-fill"></div><span id="energy-text"></span></div>
    <div class="vital-bar mana"><div class="vital-fill" id="mana-fill"></div><span id="mana-text"></span></div>
  </div>

  <div id="compass-wrap"><canvas id="compass" width="260" height="26"></canvas></div>
  <div id="fps-badge"></div>
  <canvas id="minimap" width="140" height="140"></canvas>

  <div id="quest-tracker"></div>
  <div id="interact-prompt" class="hidden"></div>
  <div id="gather-progress" class="hidden"><div id="gather-fill"></div><span id="gather-label"></span></div>
  <div id="toasts"></div>

  <div id="hotbar"></div>

  <div id="menu-buttons">
    <button id="btn-camera" class="menu-btn" title="Camera view (V)"></button>
    <button class="menu-btn" data-win="inventory" title="Inventory (E)"></button>
    <button class="menu-btn" data-win="skills" title="Skills (K)"></button>
    <button class="menu-btn" data-win="crafting" title="Crafting (C)"></button>
    <button class="menu-btn" data-win="quests" title="Quests (J)"></button>
    <button class="menu-btn" data-win="map" title="Map (M)"></button>
    <button class="menu-btn" data-win="settings" title="Settings (O)"></button>
  </div>
</div>

<!-- ===== Touch controls ===== -->
<div id="touch-ui" class="hidden">
  <div id="joystick-zone"><div id="joystick-base"><div id="joystick-knob"></div></div></div>
  <div id="touch-buttons">
    <button id="btn-jump" class="touch-btn" title="Jump"></button>
    <button id="btn-sprint" class="touch-btn" title="Sprint"></button>
    <button id="btn-action" class="touch-btn big" title="Action"></button>
    <button id="btn-place" class="touch-btn" title="Place block"></button>
  </div>
  <div id="camera-zone"></div>
</div>

<!-- ===== Windows ===== -->
<div id="window-root" class="hidden">
  <div id="game-window">
    <div id="window-tabs"></div>
    <button id="window-close">X</button>
    <div id="window-body"></div>
  </div>
</div>

<!-- ===== Dialogue ===== -->
<div id="dialogue" class="hidden">
  <!-- Always present, on every dialogue node. The only ways out used to be the
       Escape key and whatever "Thank you." option a node happened to carry — so
       a phone (no Escape) on a node with no close option was a dead end. -->
  <button id="dialogue-close" title="Close (Esc)" aria-label="Close">×</button>
  <div id="dialogue-name"></div>
  <div id="dialogue-text"></div>
  <div id="dialogue-options"></div>
</div>

<!-- ===== Classic (RuneScape-style) combat UI ===== -->
<div id="rs-ui" class="hidden">
  <div id="rs-target">
    <span id="rs-target-name"></span>
    <div id="rs-target-hp"><div id="rs-target-hp-fill"></div></div>
  </div>
  <div id="rs-panel">
    <div id="rs-styles"></div>
    <div id="rs-specials"></div>
  </div>
  <div id="rs-log"></div>
</div>

<!-- ===== Tactical combat UI ===== -->
<div id="combat-ui" class="hidden">
  <div id="turn-order"></div>
  <div id="combat-banner" class="hidden"></div>
  <div id="combat-log"></div>
  <div id="target-info" class="hidden"></div>
  <div id="combat-actions"></div>
</div>

<div id="death-screen" class="fullscreen-overlay hidden">
  <div class="title-box">
    <h2>You were overwhelmed…</h2>
    <p id="death-text"></p>
    <button id="respawn-btn" class="big-btn">Awaken at your camp</button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
